name: Каталог против реестра (только чтение)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund @supabase/supabase-js
      - env:
          SUPABASE_URL: https://llhgagharnhyylbrcxwm.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node catalog-match.mjs
